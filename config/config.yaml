# Training configuration for the Titanic survival model.
# Nothing in src/train.py hardcodes hyperparameters -- everything a run
# needs comes from a block in this file, selected by name.

data:
  raw_path: "data/raw/titanic.csv"
  test_size: 0.2
  random_state: 42

mlflow:
  experiment_name: "titanic-survival"
  # MLflow 3.x deprecated the plain filesystem store; SQLite keeps
  # everything in one local file (mlflow.db) with no server to run.
  tracking_uri: "sqlite:///mlflow.db"

# Each entry becomes one MLflow run. `model` picks the sklearn/XGBoost
# estimator, `params` are passed straight to its constructor.
runs:
  - name: "logreg_baseline"
    model: "logistic_regression"
    params:
      C: 1.0
      max_iter: 1000
      random_state: 42

  - name: "logreg_regularized"
    model: "logistic_regression"
    params:
      C: 0.1
      max_iter: 1000
      random_state: 42

  - name: "random_forest_shallow"
    model: "random_forest"
    params:
      n_estimators: 100
      max_depth: 4
      random_state: 42

  - name: "random_forest_deep"
    model: "random_forest"
    params:
      n_estimators: 400
      max_depth: 12
      min_samples_leaf: 2
      random_state: 42

  - name: "gradient_boosting"
    model: "gradient_boosting"
    params:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3
      random_state: 42

  - name: "xgboost_default"
    model: "xgboost"
    params:
      n_estimators: 300
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      eval_metric: "logloss"

  - name: "xgboost_wide"
    model: "xgboost"
    params:
      n_estimators: 600
      max_depth: 6
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      eval_metric: "logloss"
